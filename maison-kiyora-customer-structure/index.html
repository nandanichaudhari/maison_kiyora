
<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Document Setup -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#F5F0E8" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>
      Maison Kiyora | The Art of Slow Perfumery
    </title>

    <meta
      name="description"
      content="Discover Maison Kiyora, a luxury perfume house celebrating the art of slow perfumery. Explore distinctive 55ml fragrances, thoughtfully crafted scent experiences, and elegant perfume collections."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="author"
      content="Maison Kiyora"
    />

    <meta
      name="application-name"
      content="Maison Kiyora"
    />

    <meta
      name="keywords"
      content="Maison Kiyora, luxury perfume, premium perfume, niche fragrances, slow perfumery, perfume online, 55ml perfume, luxury fragrances, Oody Raspberry, Cherry You Lost, fragrance collection, perfume gift"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Maison Kiyora"
    />

    <meta
      property="og:title"
      content="Maison Kiyora | The Art of Slow Perfumery"
    />

    <meta
      property="og:description"
      content="Explore a world of distinctive fragrances and timeless elegance. Discover the art of slow perfumery at Maison Kiyora."
    />

    <meta
      property="og:image"
      content="/images/maison-kiyora-social.webp"
    />

    <meta
      property="og:image:alt"
      content="Maison Kiyora luxury perfume collection"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Maison Kiyora | The Art of Slow Perfumery"
    />

    <meta
      name="twitter:description"
      content="Discover distinctive luxury fragrances and the art of slow perfumery."
    />

    <meta
      name="twitter:image"
      content="/images/maison-kiyora-social.webp"
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Optimized Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Browser UI -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Maison Kiyora"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Maison Kiyora",
        "description": "Maison Kiyora is a perfume brand celebrating the art of slow perfumery.",
        "logo": "/images/maison-kiyora-logo.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9625360942",
          "contactType": "customer support"
        }
      }
    </script>

    <!-- Minimal Initial Styling -->
    <style>
      :root {
        color-scheme: light;
        background-color: #f5f0e8;
        color: #1d2940;
        font-family: "Manrope", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #f5f0e8;
      }

      #root {
        min-height: 100vh;
      }

      ::selection {
        background: #b69a69;
        color: #1d2940;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
